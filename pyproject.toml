[build-system]
requires = ["setuptools>=77", "Cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "revisionstore"
version = "1.0.0"
description = "Key-value store that retains the value of every key per revision."
authors = [{ name = "Bas Stottelaar", email = "basstottelaar@gmail.com" }]
keywords = ["dict", "revision", "versioning", "history", "tracking", "store"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/basilfx/python-revisionstore"
Repository = "https://github.com/basilfx/python-revisionstore"
Issues = "https://github.com/basilfx/python-revisionstore/issues"

[dependency-groups]
dev = [
    "Cython>=3.1",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
    "setuptools>=77",
]

[tool.setuptools]
packages = ["revisionstore"]
include-package-data = false

[tool.setuptools.package-data]
revisionstore = ["py.typed"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "revisionstore/*.py" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["revisionstore", "tests"]
